name: Rust PR Bench

on:
  workflow_call:
    inputs:
      backend:
        description: Benchmark backend to use (iai-callgrind, criterion, or all).
        required: false
        type: string
        default: "iai-callgrind"
      action_repository:
        description: Repository containing this workflow and scripts.
        required: false
        type: string
        default: "terjekv/github-action-iai-callgrind"
      action_ref:
        description: Ref (sha/tag/branch) for action_repository.
        required: false
        type: string
        default: ""
      benchmarks_json:
        description: >-
          JSON array of benchmark specs. String entries are treated as cargo --bench targets.
          Object entries support: name, bench, command, manifest_path, package, args.
        required: false
        type: string
        default: "[]"
      auto_discover:
        description: Discover benches from benches/*.rs when benchmarks_json is empty.
        required: false
        type: boolean
        default: true
      feature_sets_json:
        description: >-
          JSON array of feature sets. String entries map to features. Object entries support:
          name, features, no_default_features.
        required: false
        type: string
        default: '[{"name":"default","features":""}]'
      working_directory:
        description: Working directory to run benchmark commands in.
        required: false
        type: string
        default: "."
      toolchain:
        description: Rust toolchain to use.
        required: false
        type: string
        default: stable
      cargo_args:
        description: Extra args appended to every benchmark command.
        required: false
        type: string
        default: ""
      criterion_cli_args:
        description: Extra Criterion bench-binary args for default commands (appended after `--`).
        required: false
        type: string
        default: "--noplot"
      criterion_statistic:
        description: Criterion statistic used for base-vs-head comparisons (mean or median).
        required: false
        type: string
        default: "mean"
      base_sha:
        description: Optional override for PR base SHA.
        required: false
        type: string
        default: ""
      regression_threshold_pct:
        description: Percent increase considered a regression.
        required: false
        type: number
        default: 3
      regression_threshold_pct_iai_callgrind:
        description: >-
          Optional override threshold for iai-callgrind backend. Use -1 to fall back to
          regression_threshold_pct.
        required: false
        type: number
        default: -1
      regression_threshold_pct_criterion:
        description: >-
          Optional override threshold for criterion backend. Use -1 to fall back to
          regression_threshold_pct.
        required: false
        type: number
        default: -1
      fail_on_regression:
        description: Fail workflow if any case regresses above threshold.
        required: false
        type: boolean
        default: false
      comment_mode:
        description: PR comment behavior (always, on-regression, never).
        required: false
        type: string
        default: always

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      artifact_prefix: ${{ steps.artifact_prefix.outputs.value }}
    steps:
      - name: Validate action source inputs
        if: ${{ inputs.action_repository != 'terjekv/github-action-iai-callgrind' && inputs.action_ref == '' }}
        run: |
          echo "action_ref is required when action_repository is not the default." >&2
          exit 1

      - name: Checkout benchmark action repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action_repository }}
          ref: ${{ inputs.action_ref }}
          path: action-src

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Build matrix
        id: matrix
        run: |
          python3 action-src/scripts/expand_matrix.py \
            --repo-path repo \
            --working-directory "${{ inputs.working_directory }}" \
            --benchmarks-json '${{ inputs.benchmarks_json }}' \
            --feature-sets-json '${{ inputs.feature_sets_json }}' \
            --backend "${{ inputs.backend }}" \
            --criterion-cli-args="${{ inputs.criterion_cli_args }}" \
            ${{ inputs.auto_discover && '--auto-discover' || '' }} \
            --cargo-args "${{ inputs.cargo_args }}" \
            --output matrix.json

          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Build artifact prefix
        id: artifact_prefix
        run: |
          INPUT_FINGERPRINT="$(
            printf '%s\n' \
              '${{ inputs.backend }}' \
              '${{ inputs.working_directory }}' \
              '${{ inputs.benchmarks_json }}' \
              '${{ inputs.feature_sets_json }}' \
              '${{ inputs.auto_discover }}' \
              '${{ inputs.cargo_args }}' \
              '${{ inputs.criterion_cli_args }}' \
              '${{ inputs.criterion_statistic }}' \
              '${{ inputs.base_sha }}' \
              '${{ inputs.toolchain }}' \
              '${{ inputs.action_repository }}' \
              '${{ inputs.action_ref }}'
          )"
          HASH="$(printf '%s' "$INPUT_FINGERPRINT" | sha256sum | cut -c1-12)"
          echo "value=bench-result-${HASH}" >> "$GITHUB_OUTPUT"

  benchmark:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Validate action source inputs
        if: ${{ inputs.action_repository != 'terjekv/github-action-iai-callgrind' && inputs.action_ref == '' }}
        run: |
          echo "action_ref is required when action_repository is not the default." >&2
          exit 1

      - name: Checkout benchmark action repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action_repository }}
          ref: ${{ inputs.action_ref }}
          path: action-src

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Resolve base SHA
        id: refs
        run: |
          BASE_SHA='${{ inputs.base_sha }}'
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "Unable to resolve base SHA. Pass 'base_sha' input when not running on pull_request." >&2
            exit 1
          fi

          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA='${{ github.sha }}'
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Ensure iai-callgrind runner is available
        if: ${{ matrix.backend == 'iai-callgrind' }}
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v iai-callgrind-runner >/dev/null 2>&1; then
            cargo install --locked iai-callgrind-runner
          fi

          echo "IAI_CALLGRIND_RUNNER=$(command -v iai-callgrind-runner)" >> "$GITHUB_ENV"

      - name: Ensure valgrind is available
        if: ${{ matrix.backend == 'iai-callgrind' }}
        run: |
          if ! command -v valgrind >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y valgrind
          fi

      - name: Run benchmark pair
        run: |
          mkdir -p artifacts
          python3 action-src/scripts/run_pair.py \
            --repo-path repo \
            --working-directory "${{ inputs.working_directory }}" \
            --benchmark-name "${{ matrix.benchmark_name }}" \
            --feature-name "${{ matrix.feature_name }}" \
            --command "${{ matrix.command }}" \
            --backend "${{ matrix.backend }}" \
            --criterion-statistic "${{ inputs.criterion_statistic }}" \
            --head-sha "${{ steps.refs.outputs.head_sha }}" \
            --base-sha "${{ steps.refs.outputs.base_sha }}" \
            --output artifacts/result.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.artifact_prefix }}-${{ matrix.id }}
          path: artifacts/result.json

  report:
    runs-on: ubuntu-latest
    needs: benchmark
    outputs:
      has_regressions: ${{ steps.render_overall.outputs.has_regressions }}

    steps:
      - name: Validate action source inputs
        if: ${{ inputs.action_repository != 'terjekv/github-action-iai-callgrind' && inputs.action_ref == '' }}
        run: |
          echo "action_ref is required when action_repository is not the default." >&2
          exit 1

      - name: Checkout benchmark action repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action_repository }}
          ref: ${{ inputs.action_ref }}
          path: action-src

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare-matrix.outputs.artifact_prefix }}-*
          path: artifacts

      - name: Split artifacts by backend
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          source = pathlib.Path("artifacts")
          for backend in ("iai-callgrind", "criterion"):
              target = pathlib.Path(f"artifacts-{backend}")
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True, exist_ok=True)

          for path in source.rglob("result.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              backend = payload.get("backend")
              if backend not in {"iai-callgrind", "criterion"}:
                  continue
              rel = path.relative_to(source)
              dest = pathlib.Path(f"artifacts-{backend}") / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, dest)
          PY

      - name: Load IAI-Callgrind PR history
        if: github.event_name == 'pull_request' && inputs.backend != 'criterion'
        uses: actions/github-script@v7
        env:
          HISTORY_PATH: history-callgrind.json
          MARKERS_JSON: '["<!-- rust-pr-bench -->","<!-- iai-callgrind-bench -->"]'
          HISTORY_KEY: "iai-callgrind-history"
        with:
          script: |
            const helper = require('./action-src/scripts/github_pr_comment');
            await helper.loadHistory({
              github,
              context,
              core,
              historyPath: process.env.HISTORY_PATH,
              historyKey: process.env.HISTORY_KEY,
              markers: JSON.parse(process.env.MARKERS_JSON),
            });

      - name: Load Criterion PR history
        if: github.event_name == 'pull_request' && inputs.backend != 'iai-callgrind'
        uses: actions/github-script@v7
        env:
          HISTORY_PATH: history-criterion.json
          MARKERS_JSON: '["<!-- rust-pr-bench -->","<!-- criterion-bench -->"]'
          HISTORY_KEY: "criterion-history"
        with:
          script: |
            const helper = require('./action-src/scripts/github_pr_comment');
            await helper.loadHistory({
              github,
              context,
              core,
              historyPath: process.env.HISTORY_PATH,
              historyKey: process.env.HISTORY_KEY,
              markers: JSON.parse(process.env.MARKERS_JSON),
            });

      - name: Resolve report metadata
        id: report_meta
        run: |
          RUN_AT="$(date -u +"%Y-%m-%d %H:%M UTC")"
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA='${{ github.sha }}'
          fi
          PR_NUMBER='${{ github.event.pull_request.number }}'

          echo "run_at=$RUN_AT" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Render IAI-Callgrind report
        id: render_callgrind
        if: inputs.backend != 'criterion'
        run: |
          THRESHOLD='${{ inputs.regression_threshold_pct }}'
          if [ '${{ inputs.regression_threshold_pct_iai_callgrind }}' != '-1' ]; then
            THRESHOLD='${{ inputs.regression_threshold_pct_iai_callgrind }}'
          fi
          HISTORY_ARG=""
          if [ -f history-callgrind.json ]; then
            HISTORY_ARG="--history-input history-callgrind.json"
          fi
          PR_ARG=""
          if [ -n "${{ steps.report_meta.outputs.pr_number }}" ]; then
            PR_ARG="--pr-number ${{ steps.report_meta.outputs.pr_number }}"
          fi
          OMIT_RUN_META_ARG=""
          if [ "${{ inputs.backend }}" = "all" ]; then
            OMIT_RUN_META_ARG="--omit-run-meta"
          fi

          python3 action-src/scripts/render_report.py \
            --artifacts-dir artifacts-iai-callgrind \
            --threshold "$THRESHOLD" \
            --backend "iai-callgrind" \
            --markdown-output report-callgrind.md \
            --summary-output summary-callgrind.json \
            --history-key "iai-callgrind-history" \
            --head-sha "${{ steps.report_meta.outputs.head_sha }}" \
            --run-at "${{ steps.report_meta.outputs.run_at }}" \
            --max-history 10 \
            $HISTORY_ARG \
            $PR_ARG \
            $OMIT_RUN_META_ARG

          if [ "${{ inputs.backend }}" != "all" ]; then
            cat report-callgrind.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "has_regressions=$(python3 -c 'import json; print(str(json.load(open("summary-callgrind.json"))["has_regressions"]).lower())')" >> "$GITHUB_OUTPUT"

      - name: Render Criterion report
        id: render_criterion
        if: inputs.backend != 'iai-callgrind'
        run: |
          THRESHOLD='${{ inputs.regression_threshold_pct }}'
          if [ '${{ inputs.regression_threshold_pct_criterion }}' != '-1' ]; then
            THRESHOLD='${{ inputs.regression_threshold_pct_criterion }}'
          fi
          HISTORY_ARG=""
          if [ -f history-criterion.json ]; then
            HISTORY_ARG="--history-input history-criterion.json"
          fi
          PR_ARG=""
          if [ -n "${{ steps.report_meta.outputs.pr_number }}" ]; then
            PR_ARG="--pr-number ${{ steps.report_meta.outputs.pr_number }}"
          fi
          OMIT_RUN_META_ARG=""
          if [ "${{ inputs.backend }}" = "all" ]; then
            OMIT_RUN_META_ARG="--omit-run-meta"
          fi

          python3 action-src/scripts/render_report.py \
            --artifacts-dir artifacts-criterion \
            --threshold "$THRESHOLD" \
            --backend "criterion" \
            --markdown-output report-criterion.md \
            --summary-output summary-criterion.json \
            --history-key "criterion-history" \
            --head-sha "${{ steps.report_meta.outputs.head_sha }}" \
            --run-at "${{ steps.report_meta.outputs.run_at }}" \
            --max-history 10 \
            $HISTORY_ARG \
            $PR_ARG \
            $OMIT_RUN_META_ARG

          if [ "${{ inputs.backend }}" != "all" ]; then
            cat report-criterion.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "has_regressions=$(python3 -c 'import json; print(str(json.load(open("summary-criterion.json"))["has_regressions"]).lower())')" >> "$GITHUB_OUTPUT"

      - name: Compose combined report (backend=all)
        if: inputs.backend == 'all'
        run: |
          PR_ARG=""
          if [ -n "${{ steps.report_meta.outputs.pr_number }}" ]; then
            PR_ARG="--pr-number ${{ steps.report_meta.outputs.pr_number }}"
          fi

          python3 action-src/scripts/compose_combined_report.py \
            --output report.md \
            --report-callgrind report-callgrind.md \
            --report-criterion report-criterion.md \
            --run-at "${{ steps.report_meta.outputs.run_at }}" \
            --head-sha "${{ steps.report_meta.outputs.head_sha }}" \
            $PR_ARG

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compute overall regression flag
        id: render_overall
        run: |
          HAS_REGRESSIONS=false
          if [ -f summary-callgrind.json ] && [ "$(python3 -c 'import json; print(str(json.load(open("summary-callgrind.json"))["has_regressions"]).lower())')" = "true" ]; then
            HAS_REGRESSIONS=true
          fi
          if [ -f summary-criterion.json ] && [ "$(python3 -c 'import json; print(str(json.load(open("summary-criterion.json"))["has_regressions"]).lower())')" = "true" ]; then
            HAS_REGRESSIONS=true
          fi
          echo "has_regressions=$HAS_REGRESSIONS" >> "$GITHUB_OUTPUT"

      - name: Build report artifact name
        id: report_artifact_name
        run: |
          echo "value=bench-report-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}-$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report_artifact_name.outputs.value }}
          path: |
            report*.md
            summary-*.json

      - name: Upsert IAI-Callgrind PR comment
        if: >-
          github.event_name == 'pull_request' &&
          inputs.backend != 'all' &&
          inputs.backend != 'criterion' &&
          (inputs.comment_mode == 'always' ||
          (inputs.comment_mode == 'on-regression' && steps.render_callgrind.outputs.has_regressions == 'true'))
        uses: actions/github-script@v7
        env:
          REPORT_PATH: report-callgrind.md
          PRIMARY_MARKER: "<!-- iai-callgrind-bench -->"
          MARKERS_JSON: '["<!-- iai-callgrind-bench -->"]'
        with:
          script: |
            const helper = require('./action-src/scripts/github_pr_comment');
            await helper.upsertReport({
              github,
              context,
              reportPath: process.env.REPORT_PATH,
              primaryMarker: process.env.PRIMARY_MARKER,
              markers: JSON.parse(process.env.MARKERS_JSON),
              deleteExtras: false,
            });

      - name: Upsert Criterion PR comment
        if: >-
          github.event_name == 'pull_request' &&
          inputs.backend != 'all' &&
          inputs.backend != 'iai-callgrind' &&
          (inputs.comment_mode == 'always' ||
          (inputs.comment_mode == 'on-regression' && steps.render_criterion.outputs.has_regressions == 'true'))
        uses: actions/github-script@v7
        env:
          REPORT_PATH: report-criterion.md
          PRIMARY_MARKER: "<!-- criterion-bench -->"
          MARKERS_JSON: '["<!-- criterion-bench -->"]'
        with:
          script: |
            const helper = require('./action-src/scripts/github_pr_comment');
            await helper.upsertReport({
              github,
              context,
              reportPath: process.env.REPORT_PATH,
              primaryMarker: process.env.PRIMARY_MARKER,
              markers: JSON.parse(process.env.MARKERS_JSON),
              deleteExtras: false,
            });

      - name: Upsert consolidated PR comment (backend=all)
        if: >-
          github.event_name == 'pull_request' &&
          inputs.backend == 'all' &&
          (inputs.comment_mode == 'always' ||
          (inputs.comment_mode == 'on-regression' && steps.render_overall.outputs.has_regressions == 'true'))
        uses: actions/github-script@v7
        env:
          REPORT_PATH: report.md
          PRIMARY_MARKER: "<!-- rust-pr-bench -->"
          MARKERS_JSON: '["<!-- rust-pr-bench -->","<!-- iai-callgrind-bench -->","<!-- criterion-bench -->"]'
        with:
          script: |
            const helper = require('./action-src/scripts/github_pr_comment');
            await helper.upsertReport({
              github,
              context,
              reportPath: process.env.REPORT_PATH,
              primaryMarker: process.env.PRIMARY_MARKER,
              markers: JSON.parse(process.env.MARKERS_JSON),
              deleteExtras: true,
            });

      - name: Fail on regression
        if: inputs.fail_on_regression && steps.render_overall.outputs.has_regressions == 'true'
        run: |
          echo "Detected benchmark regressions above threshold."
          exit 1
