name: Rust PR Bench (IAI-Callgrind Compatibility Wrapper)

on:
  workflow_call:
    inputs:
      backend:
        description: Benchmark backend to use (gungraun, iai-callgrind, criterion, or all).
        required: false
        type: string
        default: "iai-callgrind"
      action_repository:
        description: Repository containing this workflow and scripts.
        required: false
        type: string
        default: "terjekv/github-action-iai-callgrind"
      action_ref:
        description: Ref (sha/tag/branch) for action_repository.
        required: false
        type: string
        default: ""
      benchmarks_json:
        description: >-
          JSON array of benchmark specs. String entries are treated as cargo --bench targets.
          Object entries support: name, bench, command, manifest_path, package, args.
        required: false
        type: string
        default: "[]"
      auto_discover:
        description: Discover benches from benches/*.rs when benchmarks_json is empty.
        required: false
        type: boolean
        default: true
      auto_detect_moved_benchmarks:
        description: Opt-in autodetection for benchmarks moved between workspace members.
        required: false
        type: boolean
        default: false
      feature_sets_json:
        description: >-
          JSON array of feature sets. String entries map to features. Object entries support:
          name, features, no_default_features.
        required: false
        type: string
        default: '[{"name":"default","features":""}]'
      working_directory:
        description: Working directory to run benchmark commands in.
        required: false
        type: string
        default: "."
      toolchain:
        description: Rust toolchain to use.
        required: false
        type: string
        default: stable
      cargo_args:
        description: Extra args appended to every benchmark command.
        required: false
        type: string
        default: ""
      criterion_cli_args:
        description: Extra Criterion bench-binary args for default commands (appended after `--`).
        required: false
        type: string
        default: "--noplot"
      criterion_statistic:
        description: Criterion statistic used for base-vs-head comparisons (mean or median).
        required: false
        type: string
        default: "mean"
      base_sha:
        description: Optional override for PR base SHA.
        required: false
        type: string
        default: ""
      regression_threshold_pct:
        description: Percent increase considered a regression.
        required: false
        type: number
        default: 3
      regression_threshold_pct_iai_callgrind:
        description: >-
          Compatibility name for the Gungraun / IAI-Callgrind threshold. Use -1 to
          fall back to regression_threshold_pct.
        required: false
        type: number
        default: -1
      regression_threshold_pct_gungraun:
        description: >-
          Optional override threshold for the Gungraun / IAI-Callgrind backend.
          Use -1 to fall back to the legacy-specific or generic threshold.
        required: false
        type: number
        default: -1
      regression_threshold_pct_criterion:
        description: >-
          Optional override threshold for criterion backend. Use -1 to fall back to
          regression_threshold_pct.
        required: false
        type: number
        default: -1
      fail_on_regression:
        description: Fail workflow if any unaccepted case regresses above threshold.
        required: false
        type: boolean
        default: false
      regression_override_label:
        description: >-
          Exact PR label required to activate PR-body regression exceptions. Empty disables
          regression exceptions.
        required: false
        type: string
        default: ""
      comment_mode:
        description: PR comment behavior (always, on-regression, never).
        required: false
        type: string
        default: always
    outputs:
      has_regressions:
        description: Whether the latest run measured any regressions above threshold.
        value: ${{ jobs.rust-pr-bench.outputs.has_regressions }}
      has_unaccepted_regressions:
        description: Whether the latest run has regressions not covered by an approved exception.
        value: ${{ jobs.rust-pr-bench.outputs.has_unaccepted_regressions }}

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      backend: ${{ inputs.backend }}
      action_repository: ${{ inputs.action_repository }}
      action_ref: ${{ inputs.action_ref }}
      benchmarks_json: ${{ inputs.benchmarks_json }}
      auto_discover: ${{ inputs.auto_discover }}
      auto_detect_moved_benchmarks: ${{ inputs.auto_detect_moved_benchmarks }}
      feature_sets_json: ${{ inputs.feature_sets_json }}
      working_directory: ${{ inputs.working_directory }}
      toolchain: ${{ inputs.toolchain }}
      cargo_args: ${{ inputs.cargo_args }}
      criterion_cli_args: ${{ inputs.criterion_cli_args }}
      criterion_statistic: ${{ inputs.criterion_statistic }}
      base_sha: ${{ inputs.base_sha }}
      regression_threshold_pct: ${{ inputs.regression_threshold_pct }}
      regression_threshold_pct_iai_callgrind: ${{ inputs.regression_threshold_pct_iai_callgrind }}
      regression_threshold_pct_gungraun: ${{ inputs.regression_threshold_pct_gungraun }}
      regression_threshold_pct_criterion: ${{ inputs.regression_threshold_pct_criterion }}
      fail_on_regression: ${{ inputs.fail_on_regression }}
      regression_override_label: ${{ inputs.regression_override_label }}
      comment_mode: ${{ inputs.comment_mode }}
    secrets: inherit
