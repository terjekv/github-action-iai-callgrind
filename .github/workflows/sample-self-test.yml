name: Sample Fixture Self-Test

on:
  pull_request:
    paths:
      - ".github/workflows/iai-callgrind-pr-bench.yml"
      - ".github/workflows/rust-pr-bench.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/sample-self-test.yml"
      - "scripts/**"
      - "tests/**"
      - "examples/sample-rust-app/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run Python script tests
        run: |
          python3 -m py_compile scripts/backend_names.py scripts/deprecation_warnings.py scripts/expand_matrix.py scripts/precompile_benchmarks.py scripts/regression_overrides.py scripts/render_report.py scripts/compose_combined_report.py scripts/resolve_threshold.py scripts/run_pair.py scripts/runner_dispatch.py
          python3 -m unittest discover -s tests -v

      - name: Run JS helper tests
        run: node --test tests/test_github_pr_comment.js

  clippy-sample:
    needs: script-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run clippy on sample fixture
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: examples/sample-rust-app

  bench-sample-callgrind:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: iai-callgrind
      working_directory: examples/sample-rust-app
      benchmarks_json: >-
        [
          {"name":"sample_iai_callgrind_compat_bench","bench":"sample_iai_callgrind_compat_bench","backend":"iai-callgrind"}
        ]
      feature_sets_json: '[{"name":"default","features":""},{"name":"alt-impl","features":"alt-impl"}]'
      regression_threshold_pct_iai_callgrind: 2
      fail_on_regression: false
      comment_mode: always

  bench-sample-gungraun:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: gungraun
      working_directory: examples/sample-rust-app
      benchmarks_json: >-
        [
          {"name":"sample_callgrind_bench","bench":"sample_callgrind_bench","backend":"gungraun"}
        ]
      feature_sets_json: '[{"name":"default","features":""},{"name":"alt-impl","features":"alt-impl"}]'
      regression_threshold_pct_gungraun: 2
      fail_on_regression: false
      comment_mode: always

  bench-sample-criterion:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: criterion
      working_directory: examples/sample-rust-app
      benchmarks_json: >-
        [
          {"name":"sample_criterion_bench","bench":"sample_criterion_bench","backend":"criterion"}
        ]
      feature_sets_json: '[{"name":"default","features":""},{"name":"alt-impl","features":"alt-impl"}]'
      criterion_cli_args: "--noplot --sample-size 30 --measurement-time 2"
      criterion_statistic: median
      regression_threshold_pct_criterion: 10
      fail_on_regression: false
      comment_mode: always

  bench-sample-all:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: all
      working_directory: examples/sample-rust-app
      benchmarks_json: >-
        [
          {"name":"sample_callgrind_bench","bench":"sample_callgrind_bench","backend":"gungraun"},
          {"name":"sample_criterion_bench","bench":"sample_criterion_bench","backend":"criterion"}
        ]
      feature_sets_json: '[{"name":"default","features":""},{"name":"alt-impl","features":"alt-impl"}]'
      criterion_cli_args: "--noplot --sample-size 30 --measurement-time 2"
      criterion_statistic: median
      regression_threshold_pct_gungraun: 2
      regression_threshold_pct_criterion: 10
      fail_on_regression: false
      comment_mode: always

  bench-sample-mixed-migration:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: gungraun
      working_directory: examples/sample-rust-app
      benchmarks_json: >-
        [
          {
            "name":"sample_callgrind_migration",
            "bench":"sample_callgrind_bench",
            "backend":"gungraun",
            "base":{"bench":"sample_iai_callgrind_compat_bench"}
          }
        ]
      feature_sets_json: '[{"name":"default","features":""}]'
      regression_threshold_pct_gungraun: 100
      fail_on_regression: false
      comment_mode: never

  bench-sample-autodiscover-callgrind:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: iai-callgrind
      working_directory: examples/sample-rust-app
      auto_discover: true
      benchmarks_json: "[]"
      feature_sets_json: '[{"name":"default","features":""}]'
      regression_threshold_pct_iai_callgrind: 2
      regression_override_label: rust-pr-bench-self-test-approval
      fail_on_regression: true
      comment_mode: never

  check-regression-outputs:
    needs: bench-sample-autodiscover-callgrind
    runs-on: ubuntu-latest
    steps:
      - name: Validate reusable workflow regression outputs
        env:
          HAS_REGRESSIONS: ${{ needs.bench-sample-autodiscover-callgrind.outputs.has_regressions }}
          HAS_UNACCEPTED_REGRESSIONS: ${{ needs.bench-sample-autodiscover-callgrind.outputs.has_unaccepted_regressions }}
        run: |
          case "$HAS_REGRESSIONS/$HAS_UNACCEPTED_REGRESSIONS" in
            false/false|true/true|true/false) ;;
            *)
              echo "Unexpected regression outputs: $HAS_REGRESSIONS/$HAS_UNACCEPTED_REGRESSIONS" >&2
              exit 1
              ;;
          esac

  bench-sample-autodiscover-criterion:
    needs: clippy-sample
    uses: ./.github/workflows/rust-pr-bench.yml
    with:
      action_repository: ${{ github.event.pull_request.head.repo.full_name }}
      action_ref: ${{ github.event.pull_request.head.sha }}
      backend: criterion
      working_directory: examples/sample-rust-app
      auto_discover: true
      benchmarks_json: "[]"
      feature_sets_json: '[{"name":"default","features":""}]'
      criterion_cli_args: "--noplot --sample-size 20 --measurement-time 1"
      criterion_statistic: median
      regression_threshold_pct_criterion: 10
      fail_on_regression: false
      comment_mode: never
